<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RoboCopier</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #08090d; overflow: hidden; font-family: 'Consolas', 'Courier New', monospace; color: #cdd6f4; }
    .splash {
      width: 100vw; height: 100vh;
      background: #08090d url('../../assets/splash.jpg') center/cover no-repeat;
      position: relative;
      animation: fadein 280ms ease-out;
    }
    @keyframes fadein {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .scanlines {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 2px,
        rgba(255,255,255,0.04) 3px,
        transparent 4px
      );
      pointer-events: none;
    }
    .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
      pointer-events: none;
    }
    .slit-frame {
      position: absolute;
      left: 40px; right: 40px;
      bottom: 56px;
      height: 14px;
      background: rgba(0,0,0,0.85);
      border: 1px solid rgba(120,130,150,0.6);
      box-shadow: inset 0 0 6px rgba(0,0,0,0.9);
      overflow: hidden;
    }
    .slit-fill {
      position: absolute; top: 0; left: 0; bottom: 0;
      width: 0;
      background: linear-gradient(90deg, #b91c1c 0%, #ef4444 60%, #fca5a5 100%);
      box-shadow: 0 0 18px 4px rgba(239,68,68,0.65), 0 0 4px rgba(255,200,200,0.9);
      animation: fillBar 2300ms cubic-bezier(0.7, 0, 0.3, 1) forwards;
    }
    @keyframes fillBar {
      from { width: 0; }
      to   { width: 100%; }
    }
    .status {
      position: absolute;
      left: 0; right: 0;
      top: 12px;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      color: rgba(253, 224, 71, 0.95);
      text-shadow: 0 0 8px rgba(0,0,0,0.95), 0 0 3px rgba(0,0,0,1);
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
      padding: 6px 0 14px;
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="slit-frame"><div class="slit-fill"></div></div>
    <div class="status" id="status">BOOTING . . .</div>
  </div>
